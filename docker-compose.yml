version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocklens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stocklens
      POSTGRES_PASSWORD: stocklens
      POSTGRES_DB: stocklens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocklens -d stocklens"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis — Phase 6, uncomment when needed
  # redis:
  #   image: redis:7-alpine
  #   container_name: stocklens-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   command: redis-server --appendonly yes
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
    name: stocklens-postgres-data
  # redis_data:
  #   name: stocklens-redis-data

networks:
  default:
    name: stocklens-network
