version: "3.9"

services:
  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stocklens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stocklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stocklens_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-stocklens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocklens} -d ${POSTGRES_DB:-stocklens}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stocklens-network

  # ─── Backend API & WebSocket Engine ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: stocklens-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-stocklens}:${POSTGRES_PASSWORD:-stocklens_secure_password_2026}@postgres:5432/${POSTGRES_DB:-stocklens}
      JWT_SECRET: ${JWT_SECRET:-please_set_a_random_jwt_secret_min_32_chars_long!}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-please_set_a_random_refresh_secret_min_32_chars!}
      UPSTOX_ACCESS_TOKEN: ${UPSTOX_ACCESS_TOKEN:-}
      UPSTOX_API_KEY: ${UPSTOX_API_KEY:-}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-upstox}
      CORS_ORIGINS: "*"
    command: >
      sh -c "node dist/db/migrate.js && node dist/server.js"
    networks:
      - stocklens-network

  # ─── Web Frontend & Reverse Proxy (Nginx) ───────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: stocklens-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PORT:-80}:80"
    networks:
      - stocklens-network

volumes:
  postgres_data:
    name: stocklens_postgres_prod_data

networks:
  stocklens-network:
    name: stocklens_prod_net
